<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>R2 Nusantara | Distributor Rokok Grosir Resmi Malang</title>
    
    <meta name="description" content="Gudang distributor rokok resmi Malang. 233+ merek ready stock. Bayar setelah resi keluar.">
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- Font & Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { primary: '#0F3D6E', primaryDark: '#0A2A50', gold: '#C8962E', surface: '#F8FAFC' }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased bg-surface overflow-hidden">

    <!-- ==========================================
         1. GLOBAL LOADER (ANTI-MENTOK)
         ========================================== -->
    <div id="global-loader">
        <img src="logo.png" alt="R2 Logo" class="loader-logo" onerror="this.src='https://via.placeholder.com/120?text=R2';">
        <h1 class="text-2xl font-bold text-white tracking-widest uppercase mb-4">R2 Nusantara</h1>
        <div class="loading-bar-container"><div class="loading-bar"></div></div>
    </div>

    <!-- ==========================================
         2. NAVBAR
         ========================================== -->
    <header class="bg-primary text-white sticky top-0 z-40 shadow-lg border-b-2 border-gold">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="logo.png" alt="Logo" class="w-10 h-10 rounded-full bg-white p-1 border border-gold" onerror="this.style.display='none';">
                <div>
                    <h1 class="font-bold text-lg leading-tight uppercase text-gold">R2 Nusantara</h1>
                    <p class="text-[0.65rem] text-gray-300 uppercase tracking-wider">Distributor Malang</p>
                </div>
            </div>
            
            <div class="hidden md:flex flex-1 max-w-xl mx-8 relative">
                <input type="text" id="searchInput" placeholder="Cari rokok (misal: Surya, Apache)..." class="w-full pl-10 pr-4 py-2.5 rounded-full bg-primaryDark/60 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-gold">
                <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
            </div>
            
            <div class="flex items-center space-x-4">
                <button onclick="toggleCart()" class="relative p-2 text-white hover:text-gold transition">
                    <i class="fas fa-shopping-cart text-xl"></i>
                    <span id="cartCount" class="absolute top-0 right-0 w-5 h-5 bg-red-500 text-white text-[0.7rem] font-bold flex items-center justify-center rounded-full shadow">0</span>
                </button>
            </div>
        </div>
        <!-- Mobile Search -->
        <div class="md:hidden px-4 pb-3 relative">
            <input type="text" id="searchInputMobile" placeholder="Cari produk..." class="w-full pl-10 pr-4 py-2 rounded-full bg-primaryDark/60 border border-white/20 text-white text-sm">
            <i class="fas fa-search absolute left-7 top-2.5 text-gray-400"></i>
        </div>
    </header>

    <!-- ==========================================
         3. KONTEN UTAMA (KATALOG)
         ========================================== -->
    <main class="container mx-auto px-4 py-8 min-h-screen">
        
        <!-- Hero Banner -->
        <div class="hero-banner rounded-2xl p-6 md:p-10 shadow-xl mb-8 text-white relative overflow-hidden">
            <div class="relative z-10">
                <span class="px-3 py-1 bg-gold text-primaryDark rounded-full text-xs font-bold uppercase mb-4 inline-block">Gudang Resmi Terpercaya</span>
                <h2 class="text-3xl md:text-4xl font-extrabold mb-2 text-white">Katalog Produk Resmi & R2</h2>
                <p class="text-gray-300 text-sm max-w-lg mb-6 leading-relaxed">Pesan sekarang, bayar setelah resi keluar. Menyediakan 233+ merek dengan gratis ongkir minimal 1 bal.</p>
            </div>
        </div>

        <!-- Kategori Filter -->
        <div class="flex overflow-x-auto pb-4 mb-6 space-x-3 hide-scrollbar" id="categoryFilters">
            <button onclick="filterData('Semua')" class="filter-btn px-6 py-2 bg-primary text-white rounded-full text-sm font-bold active-filter">Semua Produk</button>
            <button onclick="filterData('Gudang Garam')" class="filter-btn px-6 py-2 bg-white text-gray-600 border border-gray-200 rounded-full text-sm font-semibold hover:border-gold">Gudang Garam</button>
            <button onclick="filterData('Sampoerna')" class="filter-btn px-6 py-2 bg-white text-gray-600 border border-gray-200 rounded-full text-sm font-semibold hover:border-gold">Sampoerna</button>
            <button onclick="filterData('Djarum')" class="filter-btn px-6 py-2 bg-white text-gray-600 border border-gray-200 rounded-full text-sm font-semibold hover:border-gold">Djarum</button>
            <button onclick="filterData('R2')" class="filter-btn px-6 py-2 bg-white text-gray-600 border border-gray-200 rounded-full text-sm font-semibold hover:border-gold">Khusus R2</button>
        </div>

        <!-- Grid Produk -->
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
            <!-- Render Data by Javascript -->
        </div>
    </main>

    <!-- ==========================================
         4. KERANJANG BELANJA (SIDEBAR)
         ========================================== -->
    <div id="cartSidebar" class="fixed inset-y-0 right-0 w-full md:w-[400px] bg-white shadow-2xl z-50 transform translate-x-full flex flex-col">
        <div class="p-5 border-b flex justify-between items-center bg-primary text-white">
            <h3 class="font-bold text-lg"><i class="fas fa-shopping-cart mr-2 text-gold"></i> Keranjang Belanja</h3>
            <button onclick="toggleCart()" class="text-white hover:text-red-400 transition"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
            <!-- Item Keranjang Masuk Sini -->
        </div>
        <div class="p-5 border-t bg-white shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]">
            <div class="flex justify-between mb-4">
                <span class="font-bold text-gray-600">Total Tagihan:</span>
                <span id="cartTotal" class="font-black text-xl text-primary">Rp 0</span>
            </div>
            <button onclick="checkoutWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 rounded-xl shadow-lg flex justify-center items-center transition transform hover:-translate-y-1">
                <i class="fab fa-whatsapp text-xl mr-2"></i> Buat Pesanan
            </button>
        </div>
    </div>
    <!-- Overlay Transparan untuk Keranjang -->
    <div id="cartOverlay" class="fixed inset-0 bg-black/60 z-40 hidden backdrop-blur-sm transition-opacity" onclick="toggleCart()"></div>

    <!-- ==========================================
         5. SCRIPTS
         ========================================== -->
    <!-- Muat Data Dulu, Baru Logika Aplikasi -->
    <script src="data.js"></script>
    <script src="app.js"></script>
    
    <!-- SAFETY NET (ANTI-MENTOK MUTLAK) -->
    <script>
        // Apapun yang terjadi di file JS eksternal, baris kode ini menjamin loader hilang!
        setTimeout(() => {
            const loader = document.getElementById('global-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    document.body.classList.remove('overflow-hidden');
                }, 500);
            }
        }, 3500); // Maksimal loading 3.5 detik
    </script>
</body>
</html>
