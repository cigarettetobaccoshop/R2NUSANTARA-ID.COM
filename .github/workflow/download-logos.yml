name: Download logos and commit

on:
  workflow_dispatch: {}
  push:
    branches:
      - add-logos-from-issues

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install gdown
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Make download script executable
        run: chmod +x ./scripts/download-logos.sh

      - name: Run download script
        run: ./scripts/download-logos.sh
        env:
          # allow gdown to work with unauthenticated downloads
          GDOWN_NO_SSL_VERIFY: '1'

      - name: Create commit and PR (if changes)
        uses: peter-evans/create-pull-request@v5
        with:
          # Uses the GITHUB_TOKEN; repository must allow Actions write permissions
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add logos from issues (#2)"
          branch: add-logos-from-issues
          base: main
          title: "Add logos from issues"
          body: |
            Menambahkan manifest dan skrip untuk mengambil logo yang dilampirkan pada issue #2.

            Files added:
            - assets/logo/manifest.md — daftar gambar + sumber
            - scripts/download-logos.sh — otomatisasi download dari Google Drive
            - .github/workflows/download-logos.yml — workflow untuk mengunduh dan commit

            Langkah berikutnya:
            - Jika workflow dijalankan secara lokal atau di Actions, file gambar akan ditambahkan ke branch.

      # Optional fallback using a PAT if push is blocked by branch protection rules.
      # To use this fallback, create a secret named REPO_PAT with a Personal Access Token
      # that has repo scope, then uncomment the following step and comment out the
      # peter-evans/create-pull-request step above.
